[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xp"
version = "0.1.0"
description = "XP: explore-vs-exploit study of Kairi (reward-driven) vs Kaiser (uncertainty-driven)"
requires-python = ">=3.9"
dependencies = ["numpy", "pandas", "pyyaml", "matplotlib"]

[project.optional-dependencies]
dev = ["pytest"]
minigrid = ["torch>=2.0", "minigrid>=3.0"]
showdown = ["poke-env==0.10.0"]

[tool.setuptools.packages.find]
include = ["xp*"]

[tool.setuptools.package-data]
"xp.showdown" = ["champions_patch.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not showdown'"
markers = ["showdown: needs a running local Pokemon Showdown server (excluded from the default run)"]
